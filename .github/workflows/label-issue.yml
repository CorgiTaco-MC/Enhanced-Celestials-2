name: Label issue

on:
  issues:
    types: [ opened ]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add labels matching the "Minecraft Version" and "Project" dropdown answers
        uses: actions/github-script@v7
        with:
          script: |
            const allowedVersions = ["1.20.1", "1.21.1", "26.1", "26.2"];
            const allowedProjects = ["Core", "Default Lunar Events", "Shaders", "Datapack Editor"];
            const body = context.payload.issue.body || "";

            const answer = (heading) => {
              const match = body.match(new RegExp(`###\\s*${heading}\\s*\\r?\\n\\r?\\n([^\\r\\n]+)`, "i"));
              return match ? match[1].trim() : null;
            };

            const allowed = [...allowedVersions, ...allowedProjects];
            const labels = [answer("Minecraft Version"), answer("Project")].filter(label => allowed.includes(label));

            if (labels.length === 0) {
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels,
            });
